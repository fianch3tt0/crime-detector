version: "3.9"

services:

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: crimedetector
      POSTGRES_USER: crimedetector
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimedetector"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crimedetector:${POSTGRES_PASSWORD}@db/crimedetector
      SODA_APP_TOKEN: ${SODA_APP_TOKEN}
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && gunicorn --bind 0.0.0.0:8000 --workers 4 app:app"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://crimedetector:${POSTGRES_PASSWORD}@db/crimedetector
      SODA_APP_TOKEN: ${SODA_APP_TOKEN}
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: python -m crime_detector.ingestion.scheduler

volumes:
  pgdata:
