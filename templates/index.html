<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fort Worth Crime Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>

<header>
  <h1>Fort Worth Crime Map</h1>
</header>

<div id="controls">
  <div id="date-label">Showing: <strong id="date-display">Today</strong></div>

  <div class="scroll-wheel-wrap">
    <div class="scroll-wheel" id="date-scroll">
      <div class="scroll-item selected" data-days="0">Today</div>
      <div class="scroll-item" data-days="3">Past 3 days</div>
      <div class="scroll-item" data-days="7">Past week</div>
      <div class="scroll-item" data-days="14">Past 2 weeks</div>
      <div class="scroll-item" data-days="30">Past month</div>
      <div class="scroll-item" data-days="90">Past 3 months</div>
      <div class="scroll-item" data-days="365">Past year</div>
    </div>
  </div>

  <span id="crime-count"></span>
</div>

<div id="map"></div>

<footer>
  <p>
    Data source:
    <a href="https://data.fortworthtexas.gov" target="_blank" rel="noopener noreferrer">
      City of Fort Worth Open Data
    </a>.
    Crime data is <strong>as reported</strong>; accuracy and completeness are not guaranteed.
    Records are <strong>not pinned to specific addresses or residences</strong>.
  </p>
</footer>

<script src="/static/js/map.js"></script>
<script src="/static/js/filters.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    initMap();
    initScrollWheel();
  });
</script>

</body>
</html>
